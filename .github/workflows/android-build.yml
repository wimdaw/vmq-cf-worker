name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'monitor-android/**'
      - '.github/workflows/android-build.yml'
    branches:
      - edgeone
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x monitor-android/gradlew

      - name: Build with Gradle
        run: |
          cd monitor-android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vmq-monitor-debug-apk
          path: monitor-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "V免签 Android 监控端最新测试包"
          body: "V免签 Android 监控端测试安装包 (Debug APK)\n\n构建提交：${{ github.sha }}"
          files: monitor-android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
